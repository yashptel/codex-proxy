services:
  codex-proxy:
    image: ghcr.io/icebear0828/codex-proxy:v2.0.93
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      CODEX_PROXY_HOST: 0.0.0.0
      # Mac Mini (Apple Silicon) -> container runs linux/arm64.
      # If your image is amd64-only and runs emulated, set CODEX_ARCH=x64 in .env.
      CODEX_PLATFORM: ${CODEX_PLATFORM:-linux}
      CODEX_ARCH: ${CODEX_ARCH:-arm64}
    volumes:
      # Named volumes persist across Dokploy redeploys (Dokploy re-clones the
      # repo dir on every deploy, so relative ./ mounts get wiped).
      - codex-proxy-data:/app/data # OAuth tokens, accounts, rotation/quota state
      - codex-proxy-config:/app/config # proxy config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The image's built-in healthcheck hits an authenticated /health and gets a
    # 401 (the proxy auto-creates a global proxy_api_key on first boot), so the
    # container is marked "unhealthy" and Traefik filters it out -> 404.
    # Override it: treat "server responded at all" as healthy. Auth stays on.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/health',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.codex-proxy.rule=Host(`openai.squiwo.com`)
      - traefik.http.routers.codex-proxy.entrypoints=websecure
      - traefik.http.routers.codex-proxy.tls.certresolver=letsencrypt
      - traefik.http.services.codex-proxy.loadbalancer.server.port=8080
    # Traefik reaches the proxy over dokploy-network — no host ports needed.
    # For the ONE-TIME dashboard login (localhost is exempt from proxy_api_key,
    # and the ChatGPT OAuth callback lands on :1455), temporarily switch these
    # to `ports:` and redeploy, then switch back after logging in (auth persists
    # in the codex-proxy-data volume).
    #   ports:
    #     - "127.0.0.1:8080:8080"
    #     - "127.0.0.1:1455:1455"
    expose:
      - "8080"
      - "1455"

volumes:
  codex-proxy-data:
  codex-proxy-config:

networks:
  dokploy-network:
    external: true
